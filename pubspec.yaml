name: flutter_application_1
description: "Pocket Notes: Movies - a Flutter app with SQLite and saved theme."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database (Android / iOS)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Desktop support (main.dart imports this, so it must NOT be a dev dependency)
  sqflite_common_ffi: ^2.3.4

  # Saved dark mode preference (SharedPreferencesAsync needs 2.3.0 or newer)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
